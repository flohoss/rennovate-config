name: renovate

on:
  workflow_dispatch: # allows the workflow to be run manually when desired
  schedule: # runs this workflow at the scheduled time (UTC)
    - cron: '0 12 * * *'
  push: # runs this workflow when pushes to the main branch are made
    branches:
      - main

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Run Renovate
        uses: renovatebot/github-action@v43.0.11
        with:
          docker-user: root
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: ${{ github.workspace }}/config.js
        env:
          GITHUB_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Check Open PRs and Notify
        env:
          GITHUB_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          echo "Fetching open pull requests..."
          OPEN_PRS=$(gh pr list \
            --repo "flohoss/docker-compose" \
            --state open \
            --assignee "flohoss" \
            --json number,title,url)

          if [ "$(echo "$OPEN_PRS" | jq length)" -gt 0 ]; then
            echo "Open PRs found, sending notifications..."
            echo "$OPEN_PRS" | jq -c '.[]' | while read -r pr; do
              NUMBER=$(echo "$pr" | jq -r '.number')
              TITLE=$(echo "$pr" | jq -r '.title')
              URL=$(echo "$pr" | jq -r '.url')

              curl -s -X POST "$NTFY_URL" \
                -H "Authorization: Bearer $NTFY_TOKEN" \
                -H "X-Tags: twisted_rightwards_arrows" \
                -H "X-Title: PR #${NUMBER} - ${TITLE}" \
                -H "X-Actions: view, Open PR, ${URL}" \
                -d "A Renovate PR needs your attention."
            done
          else
            echo "No open pull requests found."
          fi
