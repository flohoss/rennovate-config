name: renovate

on:
  workflow_dispatch: # allows the workflow to be run manually when desired
  schedule: # runs this workflow at the scheduled time (UTC)
    - cron: '0 12 * * *'
  push: # runs this workflow when pushes to the main branch are made
    branches:
      - main

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Run Renovate
        uses: renovatebot/github-action@v43.0.11
        with:
          docker-user: root
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: ${{ github.workspace }}/config.js
        env:
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Check Open PRs and Notify
        env:
          GITHUB_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          echo "Fetching open pull requests..."
          OPEN_PRS=$(gh pr list --repo flohoss/docker-compose --state open --assignee flohoss --json title,url --jq '.[] | "- \(.title): \(.url)"')

          if [ -n "$OPEN_PRS" ]; then
            echo "Open PRs found, sending notification..."
            MESSAGE=$(printf "Open Pull Requests:\n%s" "$OPEN_PRS")
            curl -s -X POST "$NTFY_URL" \
              -H "Authorization: Bearer $NTFY_TOKEN" \
              -d "$MESSAGE"
          else
            echo "No open pull requests found."
          fi
